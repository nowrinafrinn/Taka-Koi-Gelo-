{% extends 'base.html' %}

{% block title %}Log in · Taka Koi Gelo?{% endblock %}

{% block content %}
  <section class="form-card">
    <h1>Welcome back</h1>
    <p class="lede">Let’s see where the taka went.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form }}
      {# Keeps ?next=… so the user returns to the page they asked for. #}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-buttons">
        <button type="submit" class="button">Log in</button>
      </div>
    </form>

    <p class="form-footer">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
  </section>
{% endblock %}
