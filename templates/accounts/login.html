{% extends 'base.html' %}

{% block title %}Log in · Taka Koi Gelo?{% endblock %}

{% block content %}
  <section class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Let’s see where the taka went.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form }}
      {# Keeps ?next=… so the user returns to the page they asked for. #}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="button">Log in</button>
    </form>

    <p>New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
  </section>
{% endblock %}
