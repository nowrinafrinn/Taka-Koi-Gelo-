{% extends 'base.html' %}

{% block title %}Sign up · Taka Koi Gelo?{% endblock %}

{% block content %}
  <section class="form-card">
    <h1>Start tracking</h1>
    <p class="lede">Know where your money goes, before it disappears.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {{ form }}
      <div class="form-buttons">
        <button type="submit" class="button">Create account</button>
      </div>
    </form>

    <p class="form-footer">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
  </section>
{% endblock %}
